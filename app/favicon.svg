<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sky background -->
  <rect width="32" height="32" rx="6" fill="#4F8EF7"/>
  <!-- Roof -->
  <polygon points="16,4 28,13 4,13" fill="#fff" opacity="0.95"/>
  <!-- Building body -->
  <rect x="6" y="13" width="20" height="15" fill="#fff" opacity="0.95"/>
  <!-- Door -->
  <rect x="13" y="20" width="6" height="8" rx="3" fill="#4F8EF7"/>
  <!-- Left window -->
  <rect x="8" y="16" width="4" height="4" rx="1" fill="#4F8EF7"/>
  <!-- Right window -->
  <rect x="20" y="16" width="4" height="4" rx="1" fill="#4F8EF7"/>
  <!-- Flag pole -->
  <line x1="16" y1="4" x2="16" y2="1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flag -->
  <polygon points="16,1 21,2.5 16,4" fill="#FFD93D"/>
</svg>
