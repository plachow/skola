server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # Always validate cache – browser sends ETag/If-None-Match,
        # nginx returns 304 if unchanged (fast) or new content if updated.
        # Prevents stale JS/CSS after a deploy without requiring Ctrl+F5.
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:";
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
}
