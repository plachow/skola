services:
  skola:
    image: ghcr.io/plachow/skola:latest
    container_name: skola
    restart: unless-stopped
    pull_policy: always
    environment:
      - TZ=Europe/Prague
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skola.rule=Host(`skola.plachy.cz`)"
      - "traefik.http.routers.skola.entrypoints=web"
      - "traefik.http.services.skola.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
